server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the original Host (including any non-standard port like :8787)
    # in any absolute redirect we emit, instead of rewriting to localhost.
    port_in_redirect on;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;
    gzip_min_length 1024;

    # Bare root -> send visitors to the app under /panelpass/,
    # preserving the host+port the browser used (e.g. mywebsite.com:8787).
    location = / {
        return 302 /panelpass/;
    }

    # Normalize /panelpass (no trailing slash) -> /panelpass/
    location = /panelpass {
        return 302 /panelpass/;
    }

    # Serve the PanelPass app (built with base: '/panelpass/')
    location /panelpass/ {
        try_files $uri $uri/ /panelpass/index.html;
    }

    # --- Unified provider dispatch (consumet sources + our MangaDex) via panelpass-api ---
    location /api/ {
        proxy_pass http://panelpass-api:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # --- Same-origin proxy to MangaDex via the PanelPass backend (panelpass-api) ---
    # (legacy path; new code uses /api/source/...)
    location /md-api/ {
        proxy_pass http://panelpass-api:8788/api/mangadex/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Image proxy (covers + @home page CDN) via the backend's /api/img handler.
    location /md-img/ {
        proxy_pass http://panelpass-api:8788/api/img;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Suppress favicon 404 noise.
    location = /favicon.ico {
        return 204;
    }
}
