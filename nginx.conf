server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the original Host (including any non-standard port like :8787)
    # in any absolute redirect we emit, instead of rewriting to localhost.
    port_in_redirect on;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;
    gzip_min_length 1024;

    # Bare root -> send visitors to the app under /panelpass/,
    # preserving the host+port the browser used (e.g. mywebsite.com:8787).
    location = / {
        return 302 /panelpass/;
    }

    # Normalize /panelpass (no trailing slash) -> /panelpass/
    location = /panelpass {
        return 302 /panelpass/;
    }

    # Serve the PanelPass app (built with base: '/panelpass/')
    location /panelpass/ {
        try_files $uri $uri/ /panelpass/index.html;
    }
}
